; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Grava o daily-report.csv da raiz a partir das linhas "CSV,..." (monitor/filter_gasguard.py)
monitor_filters = default, gasguard

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor